name: Checks

on: [push]

jobs:
  checks:
    # ubuntu-latest is 26.04, and ruby-builder has no 3.3.3 build for it.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          cache-version: 1

      - name: HTMLProofer
        run: bundle exec rake test
